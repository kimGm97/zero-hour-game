    function briefing(){card.innerHTML='<button class="briefing-back" id="backToChapters" type="button" aria-label="返回关卡选择"><span aria-hidden="true">←</span>返回关卡选择</button><span class="eyebrow">LEVEL 02 / STORY BRIEFING</span><h1>钟楼猎杀</h1><p>你从车站炸弹的接收器中恢复出一帧监控画面：雨夜广场，一个戴白鸽吊坠的女孩。她叫小满，是匿名警告者留下的唯一线索。五分钟后，她会被伪造的母亲留言引到钟楼下，而枪手早已借公共摄像头锁定她。</p><div class="brief"><div class="row"><b>前情</b><span>枢纽爆破已阻止；炸弹接收器留下小满的影像</span></div><div class="row"><b>本章目的</b><span>确认敌人如何监视、诱导并猎杀小满，再拆掉整条事件链</span></div><div class="row"><b>核心目标</b><span>让小满活过倒计时 00:40</span></div><div class="row"><b>主线疑问</b><span>白鸽吊坠里藏着什么，为什么值得敌人杀人灭口？</span></div><div class="row"><b>求助方式</b><span>屏幕上方显示当前思路；按 H 或询问入口处的巡警周岚</span></div></div><button class="primary" id="start">带着车站线索进入广场</button>';modal.classList.remove("hidden");$("backToChapters").onclick=ZeroCampaign.backToChapters;$("start").onclick=function(){modal.classList.add("hidden");if(!meta.prologueSeen)opening();else{state.running=true;setTimeout(function(){toast("巡警周岚就在入口。如果失去方向，按 H 或直接找她交谈。")},350)}}}
    function opening(){var p=$("prologue");state.running=false;state.time=2;renderUI();p.className="prologue";setTimeout(function(){state.time=0;renderUI();p.classList.add("shot")},1600);setTimeout(function(){p.classList.add("blackout")},2550);setTimeout(function(){p.classList.add("reveal")},3200);$("wake").onclick=function(){meta.prologueSeen=true;save();p.className="prologue hidden";playRewind(function(){newLoop();state.running=true;setTimeout(function(){toast("巡警周岚：先确认喷泉右侧戴白鸽吊坠的女孩。卡住时按 H。")},350)})}}

    function drawGuide(){var t=guideTarget();if(!t)return;var pulse=31+Math.sin(performance.now()/180)*5;glow(t.x,t.y,72,"rgba(219,181,106,.18)");ctx.save();ctx.strokeStyle="#dbb56a";ctx.lineWidth=2;ctx.setLineDash([6,5]);ctx.beginPath();ctx.arc(t.x,t.y,pulse,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);text("当前目标",t.x,t.y-48,11,"#f0ca80","center");for(var i=0;i<3;i++){var yy=t.y-66-i*8+Math.sin(performance.now()/210)*3;ctx.fillStyle=i===0?"#dbb56a":"rgba(219,181,106,.42)";ctx.beginPath();ctx.moveTo(t.x-6,yy-5);ctx.lineTo(t.x,yy+1);ctx.lineTo(t.x+6,yy-5);ctx.closePath();ctx.fill()}ctx.restore()}
